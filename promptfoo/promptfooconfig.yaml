# Escenario 1 (inyección directa) contra el agente local. Sin proveedores de pago ni servicios remotos.
# Las pruebas las genera `make promptfoo` a partir de attacks/scenarios.py (mismas 20 variantes y criterio de
# éxito que la campaña); el veredicto lo dan estas aserciones de promptfoo, no eval/detector.py.
description: "TFM - S1 inyección directa contra el agente (provider HTTP local)"

providers:
  - id: http://127.0.0.1:8100/chat
    config:
      method: POST
      headers: { "Content-Type": "application/json" }
      body: { message: "{{prompt}}" }
      transformResponse: "({ output: json })"   # la salida es la respuesta completa: final y tool_calls

prompts:
  - "{{prompt}}"

tests: file://../results/promptfoo/tests_s1.yaml
